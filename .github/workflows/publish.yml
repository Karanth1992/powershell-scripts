name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-and-publish:
    name: Validate and Publish to PowerShell Gallery
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest ModuleVersion
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          $manifest   = Import-PowerShellDataFile ./ADOpsKit/ADOpsKit.psd1
          if ($manifest.ModuleVersion -ne $tagVersion) {
            Write-Host "Tag v$tagVersion does not match ADOpsKit.psd1 ModuleVersion ($($manifest.ModuleVersion))." -ForegroundColor Red
            Write-Host "Update ModuleVersion in the manifest and re-tag before publishing." -ForegroundColor Red
            exit 1
          }
          Write-Host "Tag version $tagVersion matches manifest ModuleVersion." -ForegroundColor Green

      - name: Verify CHANGELOG.md has an entry for this version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          $changelog  = Get-Content ./CHANGELOG.md -Raw
          if ($changelog -notmatch [regex]::Escape("[$tagVersion]")) {
            Write-Host "CHANGELOG.md has no entry for [$tagVersion]." -ForegroundColor Red
            Write-Host "Add a changelog entry for this version before tagging a release." -ForegroundColor Red
            exit 1
          }
          Write-Host "CHANGELOG.md entry for $tagVersion found." -ForegroundColor Green

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./ADOpsKit -Recurse -Severity Warning,Error -Settings .pssa.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "No PSScriptAnalyzer warnings or errors found." -ForegroundColor Green

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path          = './ADOpsKit/Tests'
          $config.Filter.ExcludeTag = 'Integration'
          $config.Output.Verbosity  = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Host "$($result.FailedCount) test(s) failed." -ForegroundColor Red
            exit 1
          }
          Write-Host "All $($result.PassedCount) tests passed." -ForegroundColor Green

      - name: Stage a clean copy for publishing
        shell: pwsh
        run: |
          # Publish-Module packages every file under -Path verbatim - it has no
          # concept of .gitignore. A previous release accidentally shipped a
          # stray .claude/settings.local.json that was sitting untracked in the
          # working tree at publish time. Stage only the files that actually
          # belong in the package instead of trusting the tree to be clean.
          # The staging leaf folder must be named exactly 'ADOpsKit' - Publish-Module
          # validates the module name against the containing folder name, not just
          # the manifest contents, and rejects a mismatched folder name.
          $stageDir = Join-Path $env:RUNNER_TEMP 'ADOpsKit-publish\ADOpsKit'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -Path './ADOpsKit/ADOpsKit.psd1', './ADOpsKit/ADOpsKit.psm1', './ADOpsKit/Public', './ADOpsKit/Private', './ADOpsKit/en-US' -Destination $stageDir -Recurse -Force
          Write-Host "Staged package contents:" -ForegroundColor Cyan
          Get-ChildItem -Path $stageDir -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName.Substring($stageDir.Length + 1))" }
          "STAGE_DIR=$stageDir" >> $env:GITHUB_ENV

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path $env:STAGE_DIR -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery
          Write-Host "Published ADOpsKit $($env:GITHUB_REF_NAME) to PowerShell Gallery." -ForegroundColor Green
